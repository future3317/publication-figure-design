[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "publication-figure-design"
# Package compatibility identifier; the repository keeps one current implementation.
version = "4.0.0"
description = "Reference-first orchestration and QA for publication-grade scientific figures"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.5",
  "PyYAML>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
core = ["numpy>=1.24", "Pillow>=9.5", "PyYAML>=6.0"]
render-python = ["matplotlib>=3.7", "pandas>=1.5", "scipy>=1.10", "seaborn>=0.12"]
reference-analysis = ["scikit-learn>=1.2", "colorspacious>=1.1", "PyMuPDF>=1.24"]
reference-ml = ["torch>=2.0", "transformers>=4.40"]
perceptual = ["lpips>=0.1.4", "dreamsim>=0.2"]
vector = ["svgutils>=0.3", "cairosvg>=2.7"]
dev = ["pytest>=7", "scikit-image>=0.22"]

[project.scripts]
pfd = "publication_figure_design.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
publication_figure_design = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts"]
python_files = ["test_*.py"]
