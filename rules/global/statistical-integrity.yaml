rules:
- id: STAT-001
  title: Define the observation unit
  scope: global
  severity: block
  statement: Every n must identify the observation unit and distinguish biological
    from technical replicates.
  applicability:
    figure_types:
    - '*'
    outputs:
    - digital
    - print
  evidence:
  - source_id: nature-formatting-guide
    source_type: journal_guidance
    section: sample-size
  verification:
    mode: hybrid
    checks:
    - replicate_unit_audit
    - caption_contract
  override:
    allowed: false
  tags:
  - statistics
  - replication
  authority: scientific_integrity
  rationale: Every n must identify the observation unit and distinguish biological
    from technical replicates.
- id: STAT-002
  title: Preserve paired and repeated-measures identity
  scope: global
  severity: block
  statement: Paired or repeated-measures observations must retain subject or sample
    identity through aggregation and plotting.
  applicability:
    figure_types:
    - paired_operating_point
    - distributions
    - scatter_correlation
    outputs:
    - digital
    - print
  evidence:
  - source_id: pfd-scientific-contract
    source_type: project_contract
    section: comparison_integrity
  - source_id: weissgerber-2015
    source_type: evidence_based_guidance
    section: paired_and_small_sample_data
  verification:
    mode: hybrid
    checks:
    - pairing_identity_audit
    - binding_source_trace
  override:
    allowed: false
  tags:
  - statistics
  - paired-data
  authority: scientific_integrity
  rationale: Paired or repeated-measures observations must retain subject or sample
    identity through aggregation and plotting.
- id: STAT-003
  title: Statistical methods and multiplicity remain explicit
  scope: global
  severity: block
  statement: Test method, tail, multiple-comparison correction, effect size, interval,
    test statistic, and degrees of freedom remain available when applicable; stars
    alone are not a statistical definition.
  applicability:
    figure_types:
    - '*'
    outputs:
    - digital
    - print
  evidence:
  - source_id: nature-formatting-guide
    source_type: journal_guidance
    section: statistics
  - source_id: weissgerber-2015
    source_type: evidence_based_guidance
    section: beyond_bar_and_line_graphs
  verification:
    mode: hybrid
    checks:
    - statistical_metadata_audit
    - legend_caption_review
  override:
    allowed: false
  tags:
  - statistics
  - reporting
  authority: scientific_integrity
  rationale: Test method, tail, multiple-comparison correction, effect size, interval,
    test statistic, and degrees of freedom remain available when applicable; stars
    alone are not a statistical definition.
- id: STAT-004
  title: Missingness and exclusions are traceable
  scope: global
  severity: block
  statement: Missing observations, exclusions, outlier criteria, and filtering must
    be recorded and cannot be chosen only to improve appearance.
  applicability:
    figure_types:
    - '*'
    outputs:
    - digital
    - print
  evidence:
  - source_id: pfd-scientific-contract
    source_type: project_contract
    section: data_provenance
  verification:
    mode: hybrid
    checks:
    - exclusion_trace
    - source_data_reconciliation
  override:
    allowed: false
  tags:
  - statistics
  - missing-data
  authority: scientific_integrity
  rationale: Missing observations, exclusions, outlier criteria, and filtering must
    be recorded and cannot be chosen only to improve appearance.
- id: STAT-005
  title: Small-sample continuous data shows individual observations
  scope: global
  severity: warn
  statement: For small-sample continuous data, the figure must show individual observations,
    a dot plot, violin, box plot, or other distribution mark in addition to or instead
    of a mean-only bar; a mean bar alone is insufficient.
  applicability:
    figure_types:
    - '*'
    outputs:
    - digital
    - print
  evidence:
  - source_id: weissgerber-2015
    source_type: evidence_based_guidance
    section: beyond_bar_and_line_graphs
  - source_id: plos-data-presentation
    source_type: publisher_guidance
    section: data_distribution
  verification:
    mode: hybrid
    checks:
    - raw_point_visibility
    - distribution_mark_presence
  override:
    allowed: true
    reason_required: true
  tags:
  - statistics
  - distribution
  - small-sample
  authority: evidence_based_guidance
  rationale: For small-sample continuous data, the figure must show individual observations or a distribution mark; a mean bar alone is insufficient.
