rules:
  - id: CURVE-001
    title: Separate observations, trend, and uncertainty
    scope: family
    severity: block
    statement: High-frequency or jagged observations must remain distinguishable from any declared trend or smoothing and its uncertainty band; smoothing is a documented transform and never a silent replacement for source data.
    applicability: {figure_types: [curve_comparison, statistical_discovery, multi_axis_comparison, time_series], outputs: [digital, print]}
    evidence: [{source_id: pfd-scientific-contract, source_type: project_contract, section: data_provenance}]
    verification: {mode: hybrid, checks: [raw_trend_uncertainty_audit, render_trace, final_size_review]}
    override: {allowed: false}
    tags: [family, curves, smoothing, uncertainty]
  - id: CURVE-002
    title: Preserve discrete frontier structure
    scope: family
    severity: warn
    statement: Discrete or irregular evaluation points must use point, step, binned, or another explicit discrete grammar; unordered points must not be presented as a continuous trajectory.
    applicability: {figure_types: [curve_comparison, statistical_discovery, multi_axis_comparison], outputs: [digital, print]}
    evidence: [{source_id: pfd-semantic-encoding, source_type: project_contract, section: relationships}]
    verification: {mode: hybrid, checks: [ordered_relation_audit, mark_geometry_review]}
    override: {allowed: true, reason_required: true}
    tags: [family, curves, discrete]
  - id: CURVE-003
    title: Prevent uncertainty-band color mixing
    scope: family
    severity: block
    statement: Overlapping uncertainty bands must preserve series identity and readable uncertainty semantics; use hierarchy, outlines, caps, error bars, or another declared representation when translucent fills create muddy mixed regions.
    applicability: {figure_types: [curve_comparison, statistical_discovery, multi_axis_comparison, time_series], outputs: [digital, print]}
    evidence: [{source_id: pfd-semantic-encoding, source_type: project_contract, section: visual_channels}]
    verification: {mode: hybrid, checks: [uncertainty_overlap_audit, series_separation_audit, final_size_review]}
    override: {allowed: false}
    tags: [family, curves, uncertainty, contrast]
  - id: CURVE-004
    title: Establish curve and key-point hierarchy
    scope: family
    severity: warn
    statement: Primary trend, observed fluctuation, reference lines, and claim-bearing points must have an intentional visual hierarchy so key points do not disappear into background curves.
    applicability: {figure_types: [curve_comparison, statistical_discovery, multi_axis_comparison, time_series], outputs: [digital, print]}
    evidence: [{source_id: pfd-house-visual-language, source_type: project_guidance, section: hierarchy}]
    verification: {mode: hybrid, checks: [stroke_layer_audit, focal_mark_review]}
    override: {allowed: true, reason_required: true}
    tags: [family, curves, hierarchy]
  - id: CURVE-005
    title: Keep reference-line labels in clear space
    scope: family
    severity: block
    statement: Threshold, alpha, and reference-line labels must sit in clear space or outside the data region with an explicit anchor; labels must not be laid directly over the line or dense evidence.
    applicability: {figure_types: [curve_comparison, statistical_discovery, multi_axis_comparison, roc, pr_curve, calibration], outputs: [digital, print]}
    evidence: [{source_id: pfd-semantic-encoding, source_type: project_contract, section: annotation_legend}]
    verification: {mode: hybrid, checks: [reference_label_clearance, annotation_clearance]}
    override: {allowed: false}
    tags: [family, curves, reference-line, annotation]
  - id: CURVE-006
    title: Explain unequal evaluation domains
    scope: family
    severity: block
    statement: Series with different valid evaluation domains must share a declared comparison range or explicitly mark the domain difference; a visually truncated curve cannot look like an unexplained plotting error.
    applicability: {figure_types: [curve_comparison, statistical_discovery, multi_axis_comparison, roc, pr_curve, calibration], outputs: [digital, print]}
    evidence: [{source_id: pfd-scientific-contract, source_type: project_contract, section: axis_integrity}]
    verification: {mode: hybrid, checks: [curve_domain_audit, axis_domain_audit, caption_contract]}
    override: {allowed: false}
    tags: [family, curves, domain]
