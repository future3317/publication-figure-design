rules:
- id: BAR-001
  title: Preserve readability under extreme ranges
  scope: family
  severity: block
  statement: An extreme bar or interval must not compress the remaining evidence into
    an unreadable strip; use a declared log scale, broken axis, inset, or explicit
    outlier annotation without changing the data.
  applicability:
    figure_types:
    - bars_and_intervals
    - bar
    - interval
    - statistical_discovery
    outputs:
    - digital
    - print
  evidence:
  - source_id: pfd-scientific-contract
    source_type: project_contract
    section: axis_integrity
  verification:
    mode: hybrid
    checks:
    - range_compression_audit
    - axis_transform_audit
    - final_size_review
  override:
    allowed: false
  tags:
  - family
  - bars
  - intervals
  - outlier
  authority: evidence_based_guidance
  rationale: An extreme bar or interval must not compress the remaining evidence into
    an unreadable strip; use a declared log scale, broken axis, inset, or explicit
    outlier annotation without changing the data.
- id: BAR-002
  title: Keep bar-top labels within the layout
  scope: family
  severity: block
  statement: Bar-top values, interval caps, and labels must remain inside the declared
    figure clearance and must not collide with neighboring marks or the canvas edge.
  applicability:
    figure_types:
    - bars_and_intervals
    - bar
    - interval
    - statistical_discovery
    outputs:
    - digital
    - print
  evidence:
  - source_id: pfd-render-trace
    source_type: project_contract
    section: layout_clearance
  verification:
    mode: hybrid
    checks:
    - mark_label_clearance
    - mark_bbox_vs_axes
  override:
    allowed: false
  tags:
  - family
  - bars
  - intervals
  - annotation
  authority: evidence_based_guidance
  rationale: Bar-top values, interval caps, and labels must remain inside the declared
    figure clearance and must not collide with neighboring marks or the canvas edge.
