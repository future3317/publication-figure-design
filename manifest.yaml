name: publication-figure-design
version: "2.0.0"
entrypoint: "SKILL.md"

always_load:
  - "references/figure-contract.md"

routes:
  create:
    when: "new manuscript figure or major revision"
    load:
      - "references/workflow-create.md"
      - "references/encoding-and-uncertainty.md"
  concrete_reference:
    when: "a concrete reference image is supplied or selected"
    load:
      - "references/reference-driven-reconstruction.md"
      - "references/asset-adaptation.md"
    run:
      - "scripts/check_reference_fidelity.py"
  visual_optimization:
    when: "an existing figure is optimized, polished, beautified, improved, or redesigned"
    load:
      - "references/reference-driven-reconstruction.md"
      - "references/visual-reference-library.md"
      - "references/checklist.md"
      - "references/encoding-and-uncertainty.md"
    run:
      - "scripts/reference_library.py recommend"
      - "scripts/palette_manager.py"
      - "scripts/rendered_contrast.py"
      - "scripts/check_visual_optimization.py"
  asset_adaptation:
    when: "production assets, examples, or prior plotting code are considered"
    load:
      - "references/asset-adaptation.md"
      - "references/directory-map.md"
      - "references/production-asset-metadata.md"
  backend:
    when: "a plotting backend must be selected or mixed panels are required"
    load:
      - "references/backend-selection.md"
    use:
      - "scripts/backend_preference.py"
  qa:
    when: "a figure is reviewed or prepared for delivery"
    load:
      - "references/checklist.md"
      - "references/delivery-contract.md"
      - "references/figure-legend-contract.md"
      - "references/privacy-provenance.md"
      - "references/encoding-and-uncertainty.md"
    run:
      - "scripts/qa_validator.py"
      - "scripts/audit_pdf_text.py"
      - "scripts/rendered_contrast.py"
      - "scripts/check_visual_optimization.py"
  maintain_skill:
    when: "the skill itself changes"
    run:
      - "scripts/check_skill_contract.py"
      - "scripts/check_source_reconstruction_library.py"
      - "scripts/check_source_reference_catalog.py"
  source_reconstruction:
    when: "source-by-source visual grammar examples are audited, rebuilt, or validated"
    load:
      - "references/source-reconstruction-library.md"
    run:
      - "scripts/check_source_reconstruction_library.py"
      - "scripts/review_source_reconstructions.py"
      - "scripts/source_reference_catalog.py"
      - "scripts/check_source_reference_catalog.py"
  reference_intake:
    when: "a user supplies one or more images to store in the visual reference library"
    load:
      - "references/visual-reference-library.md"
      - "references/privacy-provenance.md"
    run:
      - "scripts/reference_library.py ingest"
      - "reference-local code.py + reconstruction.png"
      - "scripts/check_reference_reproductions.py"
      - "scripts/check_reference_reproduction_fidelity.py"
      - "scripts/reference_library.py validate"
      - "scripts/reference_library.py rebuild"

backend_policy:
  precedence:
    - "explicit_request"
    - "workflow_requirement"
    - "saved_preference"
    - "python_default"
  mixed_mode: "explicit_or_required_with_one_final_assembler"
  silent_substitution: false

validation:
  skill_contract: "python scripts/check_skill_contract.py"
  source_reconstruction_library: "python scripts/check_source_reconstruction_library.py"
  source_reference_catalog: "python scripts/check_source_reference_catalog.py"
  tests: "python -m unittest discover -s scripts -p test_*.py -v"
